version: "3.8"

services:
  urna-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urna-eletronica-core
    restart: unless-stopped
    ports:
      - "${URNA_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql://urna_user:${POSTGRES_PASSWORD:-urna_secret_2026}@urna-db:5432/urna_eleitoral
      - URNA_SECRET_KEY=${URNA_SECRET_KEY:-tse-simulador-chave-assinatura-2026}
      - URNA_ZONA=${URNA_ZONA:-0001}
      - URNA_SECAO=${URNA_SECAO:-0105}
      - URNA_MUNICIPIO=${URNA_MUNICIPIO:-BRASILIA - DF}
      - CARTRIDGE_DIR=/app/cartuchos
    volumes:
      - urna_cartuchos:/app/cartuchos
      - urna_data:/app/data
    depends_on:
      urna-db:
        condition: service_healthy
    networks:
      - urna-net

  urna-db:
    image: postgres:16-alpine
    container_name: urna-eletronica-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=urna_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-urna_secret_2026}
      - POSTGRES_DB=urna_eleitoral
    volumes:
      - urna_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urna_user -d urna_eleitoral"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - urna-net

volumes:
  urna_pgdata:
  urna_cartuchos:
  urna_data:

networks:
  urna-net:
    driver: bridge
